<svg xmlns="http://www.w3.org/2000/svg" width="260" height="200" viewBox="0 0 260 200" font-family="'Segoe UI', 'Open Sans', system-ui, sans-serif">
  <defs>
    <radialGradient id="orbCore" cx="50%" cy="45%" r="62%">
      <stop offset="0%"  stop-color="#f3f8ff"/>
      <stop offset="28%" stop-color="#8ec5ff"/>
      <stop offset="68%" stop-color="#2f6efe"/>
      <stop offset="100%" stop-color="#17235c"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#2f6efe" stop-opacity="0"/>
      <stop offset="78%" stop-color="#5b8dff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5b8dff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- MARK: seeing-stone orb (centered, top) -->
  <g transform="translate(130,66)">
    <circle r="60" fill="url(#aura)"/>
    <circle r="46" fill="url(#orbCore)" stroke="#9cc3ff" stroke-opacity="0.25" stroke-width="1.3"/>
    <ellipse cx="0" cy="0" rx="46" ry="13" fill="none" stroke="#dcebff" stroke-opacity="0.35" stroke-width="1.3"/>
    <g stroke="#bcd8ff" stroke-opacity="0.55" stroke-width="1.8" stroke-linecap="round">
      <line x1="0" y1="-54" x2="0" y2="-67"/>
      <line x1="38" y1="-38" x2="48" y2="-48"/>
      <line x1="54" y1="0" x2="67" y2="0"/>
      <line x1="-38" y1="-38" x2="-48" y2="-48"/>
      <line x1="-54" y1="0" x2="-67" y2="0"/>
    </g>
    <circle cx="-12" cy="-15" r="9" fill="#ffffff" fill-opacity="0.78"/>
  </g>

  <!-- WORDMARK (dark theme: light text), centered -->
  <text x="130" y="162" text-anchor="middle" font-size="40" font-weight="700" letter-spacing="0.5" fill="#eaf2ff">Calanthir</text>
  <text x="130" y="186" text-anchor="middle" font-size="14" font-weight="600" letter-spacing="5" fill="#8fb3f0">REALM OF LIGHT</text>
</svg>
